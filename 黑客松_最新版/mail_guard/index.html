<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>智慧郵件防護</title>
  <style>
    :root{--ink:#172033;--muted:#667085;--line:#e5eaf1;--blue:#315efb}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f5f7fb;font-family:"Segoe UI","Noto Sans TC",sans-serif}.shell{width:min(1120px,calc(100% - 32px));margin:auto}header{padding:28px 0 18px}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,#315efb,#6e8cff);font-size:22px;box-shadow:0 8px 22px #315efb35}h1{margin:0;font-size:24px}.subtitle{margin:4px 0 0;color:var(--muted);font-size:14px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:0 8px 30px #18233a0a}.control{padding:22px;display:flex;align-items:center;justify-content:space-between;gap:20px}.account{display:flex;align-items:center;gap:12px}.status-dot{width:12px;height:12px;border-radius:50%;background:#98a2b3;box-shadow:0 0 0 5px #98a2b31c}.status-dot.on{background:#12b76a;box-shadow:0 0 0 5px #12b76a1c}.account strong{display:block}.account span{color:var(--muted);font-size:13px}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}select,button,.login{height:42px;border-radius:11px;border:1px solid #d7ddea;padding:0 14px;font:inherit;background:#fff;color:var(--ink)}button,.login{cursor:pointer;font-weight:700;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}.login{color:var(--blue)}.scan{border-color:var(--blue);background:var(--blue);color:#fff;min-width:132px}.scan:disabled{opacity:.5;cursor:not-allowed}.notice{display:none;margin-top:14px;padding:13px 16px;border-radius:12px;font-size:14px}.notice.show{display:block}.notice.info{color:#175cd3;background:#eff8ff}.notice.error{color:#b42318;background:#fef3f2}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:18px 0}.summary-card{padding:16px 18px;border-radius:16px;border:1px solid var(--line);background:#fff}.summary-card span{color:var(--muted);font-size:13px}.summary-card strong{display:block;margin-top:5px;font-size:25px}.results{display:grid;gap:14px;padding-bottom:40px}.group{overflow:hidden}.group-head{padding:15px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.group-title{display:flex;align-items:center;gap:9px;font-weight:800}.badge{min-width:28px;padding:3px 9px;text-align:center;border-radius:999px;background:#f2f4f7;font-size:13px}.mail-list{padding:4px 18px}.mail{display:grid;grid-template-columns:1fr auto;gap:14px;padding:15px 0;border-bottom:1px solid #eef1f5}.mail:last-child{border-bottom:0}.mail h3{margin:0 0 5px;font-size:15px}.sender,.reason{margin:0;color:var(--muted);font-size:13px;overflow-wrap:anywhere}.reason{margin-top:7px;color:#475467}.score{align-self:center;min-width:62px;text-align:center;padding:7px 10px;border-radius:10px;font-size:13px;font-weight:800}.low .group-head{background:#ecfdf3}.low .score{color:#027a48;background:#ecfdf3}.medium .group-head{background:#fffaeb}.medium .score{color:#b54708;background:#fffaeb}.high .group-head{background:#fff1f0}.high .score{color:#b42318;background:#fff1f0}.blocked .group-head{color:#fff;background:#344054}.blocked .score{color:#fff;background:#344054}.empty{padding:18px;color:#98a2b3;text-align:center;font-size:14px}.loading{width:16px;height:16px;margin-right:8px;border:2px solid #ffffff70;border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:760px){.control{align-items:flex-start;flex-direction:column}.actions{width:100%}.scan{flex:1}.summary{grid-template-columns:repeat(2,1fr)}.mail{grid-template-columns:1fr}.score{justify-self:start}}
  </style>
</head>
<body><div class="shell">
  <header><div class="brand"><div class="logo">✉</div><div><h1>智慧郵件防護</h1><p class="subtitle">Gemini ＋ SLM 雙模型風險偵測</p></div></div></header>
  <section class="panel control"><div class="account"><span id="statusDot" class="status-dot"></span><div><strong id="statusTitle">正在確認 Gmail…</strong><span id="statusText">請稍候</span></div></div><div class="actions"><a class="login" href="/auth/google/start">驗證 Gmail</a><label><span hidden>掃描封數</span><select id="limit"><option value="3">掃描 3 封</option><option value="5">掃描 5 封</option><option value="10">掃描 10 封</option><option value="20">掃描 20 封</option></select></label><button id="scanButton" class="scan" disabled>開始掃描</button></div></section>
  <div id="notice" class="notice" role="status"></div>
  <section class="summary" aria-label="風險統計"><div class="summary-card"><span>🟢 低風險</span><strong id="count-low">0</strong></div><div class="summary-card"><span>🟡 中度風險</span><strong id="count-medium">0</strong></div><div class="summary-card"><span>🔴 高度風險</span><strong id="count-high">0</strong></div><div class="summary-card"><span>🗑️ 明確垃圾</span><strong id="count-blocked">0</strong></div></section>
  <main class="results">
    <section class="panel group blocked"><div class="group-head"><div class="group-title">🗑️ 明確垃圾郵件</div><span id="badge-blocked" class="badge">0</span></div><div id="list-blocked" class="mail-list"><div class="empty">尚未掃描</div></div></section>
    <section class="panel group high"><div class="group-head"><div class="group-title">🔴 高度風險</div><span id="badge-high" class="badge">0</span></div><div id="list-high" class="mail-list"><div class="empty">尚未掃描</div></div></section>
    <section class="panel group medium"><div class="group-head"><div class="group-title">🟡 中度風險</div><span id="badge-medium" class="badge">0</span></div><div id="list-medium" class="mail-list"><div class="empty">尚未掃描</div></div></section>
    <section class="panel group low"><div class="group-head"><div class="group-title">🟢 低風險</div><span id="badge-low" class="badge">0</span></div><div id="list-low" class="mail-list"><div class="empty">尚未掃描</div></div></section>
  </main>
</div><script>
const levels=["low","medium","high","blocked"],dot=document.querySelector("#statusDot"),title=document.querySelector("#statusTitle"),statusText=document.querySelector("#statusText"),scan=document.querySelector("#scanButton"),notice=document.querySelector("#notice");
function notify(message,type="info"){notice.textContent=message;notice.className=`notice show ${type}`}function connected(ok){dot.classList.toggle("on",ok);title.textContent=ok?"Gmail 已完成驗證":"尚未連接 Gmail";statusText.textContent=ok?"可以開始掃描收件匣":"請先完成 Google 授權";scan.disabled=!ok}
async function check(){try{const r=await fetch("/api/session/status"),d=await r.json();connected(d.connected)}catch{connected(false);notify("無法確認 Gmail 狀態，請重新整理。","error")}}
function reset(){for(const l of levels){document.querySelector(`#count-${l}`).textContent="0";document.querySelector(`#badge-${l}`).textContent="0";document.querySelector(`#list-${l}`).replaceChildren()}}
function mail(item){const list=document.querySelector(`#list-${item.decision.level}`),row=document.createElement("article"),text=document.createElement("div"),h=document.createElement("h3"),sender=document.createElement("p"),reason=document.createElement("p"),score=document.createElement("div");row.className="mail";h.textContent=item.email.subject||"（無主旨）";sender.className="sender";sender.textContent=`寄件者：${item.email.sender||"未知"}`;reason.className="reason";reason.textContent=item.analysis.explanation_zh||item.decision.warning||"沒有補充說明";score.className="score";score.textContent=`${item.analysis.risk_score} 分`;text.append(h,sender,reason);row.append(text,score);list.append(row)}
function render(items){reset();const c={low:0,medium:0,high:0,blocked:0};for(const item of items){const l=item.decision.level;if(l in c){c[l]++;mail(item)}}for(const l of levels){document.querySelector(`#count-${l}`).textContent=c[l];document.querySelector(`#badge-${l}`).textContent=c[l];if(!c[l]){const e=document.createElement("div");e.className="empty";e.textContent="沒有這個等級的郵件";document.querySelector(`#list-${l}`).append(e)}}}
scan.addEventListener("click",async()=>{notice.className="notice";scan.disabled=true;scan.textContent="分析中…";try{const r=await fetch("/api/gmail/scan-connected",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({max_results:Number(document.querySelector("#limit").value)})}),d=await r.json();if(!r.ok)throw new Error(d.detail||"掃描失敗");render(d);notify(`掃描完成，共分析 ${d.length} 封郵件。`)}catch(e){notify(e.message,"error");if(String(e.message).includes("登入"))connected(false)}finally{scan.textContent="開始掃描";scan.disabled=!dot.classList.contains("on")}});check();
</script></body></html>
